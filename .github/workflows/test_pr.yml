name: Test Pull Request

# Runs the checks required before merging a PR.

on:
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: Test
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'

      - name: Install
        run: |
          npm ci

      - name: Unit Test
        run: npm run test